# ~/.tmux.conf — Everforest Dark Hard, made for Ghostty + Neovim
# Reload with: prefix + r

# ─── General ────────────────────────────────────────────────────────────────
set -g prefix C-b                         # tmux default; C-b C-b sends a literal C-b
bind C-b send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB" # true color
set -g extended-keys on                   # pass modified keys (e.g. C-S-x) through to Neovim
set -s escape-time 10                     # no delay after <Esc> in Neovim
set -g focus-events on                    # lets Neovim reload files changed outside
set -g set-clipboard on                   # OSC 52 clipboard
set -g allow-passthrough on               # images / OSC sequences from apps inside tmux

set -g mouse on
set -g history-limit 50000
set -g base-index 1                       # windows and panes start at 1, matching the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S / #W"

# ─── Keys ───────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Splits and new windows open in the current folder
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize panes with prefix + H/J/K/L (hold to repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# C-l is taken by pane navigation (vim-tmux-navigator); prefix + C-l clears the shell instead
bind C-l send-keys C-l

# Swap windows left / right
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# ─── Copy mode (vim keys) ───────────────────────────────────────────────────
# prefix + [ to enter, v to select, C-v for a block, y to copy to the system clipboard (tmux-yank)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# ─── Everforest Dark Hard theme ─────────────────────────────────────────────
# Palette: https://github.com/sainnhe/everforest/blob/master/palette.md
# Backgrounds are "default" so Ghostty's transparency shows through.
bg1="#2e383c"
bg3="#414b50"
fg="#d3c6aa"
grey0="#7a8478"
grey1="#859289"
red="#e67e80"
orange="#e69875"
yellow="#dbbc7f"
green="#a7c080"
aqua="#83c092"

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=$fg"

# Left: session name; turns orange while the prefix is pressed
set -g status-left-length 40
set -g status-left "#[fg=$bg1,bg=#{?client_prefix,$orange,$green},bold]  #S #[bg=default] "

# Window list: current window bold italic (matches the Neovim tab bar), others dimmed
setw -g window-status-separator ""
setw -g window-status-format "#[fg=$grey1] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=$green,bold,italics] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-activity-style "fg=$yellow"
setw -g window-status-bell-style "fg=$red"
setw -g monitor-activity on
set -g visual-activity off

# Right: copy-mode marker, date and time, host
set -g status-right-length 80
set -g status-right "#{?pane_in_mode,#[fg=$yellow]#[bold] COPY #[nobold],}#[fg=$grey1] %a %d %b  #[fg=$fg]%H:%M #[fg=$bg1,bg=$aqua,bold] 󰒋 #h "

# Panes
set -g pane-border-style "fg=$bg3"
set -g pane-active-border-style "fg=$green"
set -g pane-border-lines single
set -g display-panes-colour "$grey0"
set -g display-panes-active-colour "$green"

# Messages, prompts, copy-mode selection, clock
set -g message-style "fg=$fg,bg=$bg1"
set -g message-command-style "fg=$fg,bg=$bg1"
setw -g mode-style "fg=$bg1,bg=$green"
setw -g clock-mode-colour "$green"

# ─── Plugins (TPM) ──────────────────────────────────────────────────────────
# prefix + I install, prefix + U update, prefix + alt-u remove unused
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'          # y in copy mode copies to the system clipboard
set -g @plugin 'christoomey/vim-tmux-navigator'  # C-h/j/k/l across tmux panes and Neovim splits

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
