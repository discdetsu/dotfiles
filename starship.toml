# ~/.config/starship.toml — minimalist, Everforest Dark Hard
# Palette: https://github.com/sainnhe/everforest/blob/master/palette.md
"$schema" = 'https://starship.rs/config-schema.json'

palette = "everforest_dark_hard"
add_newline = true

format = """
$os\
$username\
$directory\
$git_branch\
$nodejs\
$python\
$rust\
$golang\
$lua\
$c\
$cpp\
$cmake\
$java\
$dotnet\
${custom.docker}\
$kubernetes\
$cmd_duration\
$character"""

[palettes.everforest_dark_hard]
fg     = "#d3c6aa"
grey1  = "#859289"
red    = "#e67e80"
orange = "#e69875"
yellow = "#dbbc7f"
green  = "#a7c080"
aqua   = "#83c092"
blue   = "#7fbbb3"
purple = "#d699b6"

[os]
disabled = false
style = "blue"
format = "[$symbol]($style)"

[os.symbols]
Fedora = " "
Linux = " "
Arch = " "
Ubuntu = " "
Debian = " "
Macos = " "

[username]
show_always = true
style_user = "aqua"
style_root = "bold red"
format = "[$user]($style) "

[directory]
style = "bold green"
truncation_length = 1
read_only = " \U000f033e"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "italic purple"
format = "[$symbol$branch]($style) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "yellow"
format = "[$symbol($version)]($style) "

[rust]
symbol = " "
style = "orange"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "aqua"
format = "[$symbol($version)]($style) "

[lua]
symbol = " "
style = "blue"
format = "[$symbol($version)]($style) "

[c]
symbol = " "
style = "blue"
format = "[$symbol($version)]($style) "

[cpp]
disabled = false
symbol = "\U000f0672 "
style = "blue"
format = "[$symbol($version)]($style) "

[cmake]
symbol = " "
style = "grey1"
format = "[$symbol($version)]($style) "

[java]
symbol = " "
style = "red"
format = "[$symbol($version)]($style) "

[dotnet]
symbol = "\U000f031b "
style = "purple"
format = "[$symbol($version)]($style) "

[custom.docker]
detect_files = ["Dockerfile", "Containerfile", "compose.yaml", "compose.yml", "docker-compose.yaml", "docker-compose.yml"]
shell = ["sh"]
command = "(docker --version 2>/dev/null || podman --version) | grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+' | head -n1"
symbol = " "
style = "blue"
format = "[$symbol$output]($style) "

[kubernetes]
disabled = false
symbol = "\U000f10fe "
style = "aqua"
detect_files = ["kustomization.yaml", "kustomization.yml", "Chart.yaml", "skaffold.yaml", "Tiltfile"]
detect_folders = ["k8s", "kubernetes", "manifests", "helm", "charts"]
format = '[$symbol$context( \($namespace\))]($style) '

[cmd_duration]
min_time = 2000
style = "grey1"
format = "[󱎫 $duration]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](aqua)"
